[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerevia"
version = "0.8.0"
description = "Evidence infrastructure for traceable neuroscience computation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pyedflib>=0.1.42"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cerevia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
